name: Deploy to GitHub Pages

# Pages source is legacy branch deploy (ux-prototypes /). Publish built static files to branch root.
on:
  push:
    branches:
      - ux-prototypes
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'mta/**'
      - 'mta-agentic-migration/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux-prototypes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build launcher
        working-directory: launcher
        run: npm install && npm run build

      - name: Install and build MTA prototype
        working-directory: prototypes/mta
        run: npm install && npm run build

      - name: Install and build MTA Agentic Migration prototype
        working-directory: prototypes/mta-agentic-migration
        run: npm install && npm run build

      - name: Publish static files to branch root
        run: |
          cp launcher/dist/index.html .
          cp launcher/dist/404.html .
          rm -rf assets mta mta-agentic-migration
          cp -R launcher/dist/assets .
          mkdir -p mta
          cp -R prototypes/mta/dist/* mta/
          mkdir -p mta-agentic-migration
          cp -R prototypes/mta-agentic-migration/client/dist/* mta-agentic-migration/
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets mta mta-agentic-migration
          if git diff --staged --quiet; then
            echo "No static file changes to publish."
            exit 0
          fi
          git commit -m "Publish built static site to branch root [skip ci]"
          git push
